name: "Reports R6 Verification"

on:
  push:
    branches:
      - reports/r6-saved-views-targets
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reports-r6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify Reports R6"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Reports R1-R6 targeted tests
        run: >
          node --test
          tests/reportMetrics.test.mjs
          tests/reportPaymentMetrics.test.mjs
          tests/reportPromiseMetrics.test.mjs
          tests/reportOperationsMetrics.test.mjs
          tests/reportReadModel.test.mjs
          tests/reportDataSource.test.mjs
          tests/reportExport.test.mjs
          tests/reportsUiContract.test.mjs
          tests/reportPreferences.test.mjs
          tests/reportPreferencesMigration.test.mjs
          tests/reportsR6UiContract.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start disposable Supabase
        run: supabase start

      - name: Reset disposable database through exact migration chain
        run: supabase db reset --local

      - name: Resolve disposable database URL
        run: |
          supabase status -o env > /tmp/reports_r6_supabase.env
          DB_URL=$(grep '^DB_URL=' /tmp/reports_r6_supabase.env | cut -d '=' -f2- | tr -d '"')
          if [ -z "$DB_URL" ]; then
            echo "Failed to resolve local DB_URL" >&2
            exit 1
          fi
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          rm -f /tmp/reports_r6_supabase.env

      - name: Prove saved-view and target RLS
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/reports_r6_saved_views_targets_test.sql

      - name: Run complete JavaScript suite
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup || true
