name: "Reports R4 Verification"

on:
  push:
    branches:
      - reports/r4-operations
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reports-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify Reports R4"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run Reports R1-R4 targeted tests
        run: node --test tests/reportMetrics.test.mjs tests/reportPaymentMetrics.test.mjs tests/reportPromiseMetrics.test.mjs tests/reportOperationsMetrics.test.mjs
      - name: Run complete JavaScript suite
        run: npm test
      - name: Build production application
        run: npm run build
