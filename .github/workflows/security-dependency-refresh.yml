name: "Security Dependency Refresh"

on:
  push:
    branches:
      - security/full-app-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/full-app-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade vulnerable build/router dependencies
        run: |
          npm install react-router-dom@latest vite@latest @vitejs/plugin-react@latest
          npm audit fix

      - name: Prove dependency refresh
        run: |
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Commit audited dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "duewatch-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Security: refresh vulnerable dependencies [deps-refresh]"
          git push origin HEAD:security/full-app-hardening
