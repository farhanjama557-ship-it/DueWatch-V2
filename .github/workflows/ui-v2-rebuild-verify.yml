name: "DueWatch UI v2 Rebuild Verification"

on:
  push:
    branches:
      - ui/v2-locked-rebuild
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: duewatch-ui-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Test and build locked UI rebuild"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript suite
        run: npm test

      - name: Build production application
        run: npm run build
