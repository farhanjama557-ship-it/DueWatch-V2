<?xml version="1.0"?>
<svg viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An open suitcase spilling messy, inconsistently formatted invoice fragments that pass through a translucent inspection plane — rows straightening, one item flagged for review — and arrive as organized DueWatch cards: an invoice, a client match, a due-date chip, a currency chip, a review-required chip, and an import preview receipt showing what is ready and what needs attention.">
    <defs>
      <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#231F1B" flood-opacity="0.14"></feDropShadow>
      </filter>
      <filter id="smallShadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#231F1B" flood-opacity="0.10"></feDropShadow>
      </filter>
      <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="10"></feGaussianBlur>
      </filter>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FDFAF5"></stop>
        <stop offset="1" stop-color="#F6EFE1"></stop>
      </linearGradient>
      <linearGradient id="terracottaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E8916E"></stop>
        <stop offset="1" stop-color="#D97650"></stop>
      </linearGradient>
      <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F1E8D8"></stop>
        <stop offset="1" stop-color="#E3D6BC"></stop>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#DA7756" stop-opacity="0.10"></stop>
        <stop offset="1" stop-color="#DA7756" stop-opacity="0"></stop>
      </radialGradient>
      <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.4" fill="#C9B79C" opacity="0.4"></circle>
      </pattern>
    </defs>

    <rect width="1440" height="900" fill="url(#bgGrad)"></rect>
    <circle cx="1150" cy="200" r="420" fill="url(#glow)"></circle>
    <rect x="860" y="40" width="500" height="620" fill="url(#dotGrid)" opacity="0.5"></rect>

